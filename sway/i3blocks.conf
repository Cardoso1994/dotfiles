# i3blocks for swaybar (Fedora Asahi). Based on ../i3/i3blocks_ubuntu.conf.
# Colors are Nightfox mid-tones that stay readable on both terafox and dawnfox.
separator=false
separator_block_width=3

[updates]
command=$HOME/.config/scripts/sway/fedora_update
interval=3600
signal=2
color=#ad5c7c

[disk]
command=$HOME/.config/scripts/sway/disk
interval=600
signal=3
color=#5a93aa

[cpu]
command=$HOME/.config/scripts/sway/cpu
interval=2
color=#e85c51

[memory]
command=$HOME/.config/scripts/sway/memory
interval=2
color=#618774

[volume]
command=$HOME/.config/scripts/sway/sound
interval=once
signal=10
color=#907aa9

[time]
command=$HOME/.config/scripts/i3/time
interval=30
color=#56949f
