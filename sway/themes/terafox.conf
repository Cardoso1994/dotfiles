# Nightfox: terafox (dark). Values from EdenEast/nightfox.nvim, the same
# palette as wezterm/config/colors.lua.
set $theme_name terafox
set $bg      #152528
set $bg_trans #152528d9
set $bg_bar  #0f1c1e
set $bg_alt  #1d3337
set $sel     #293e40
set $fg      #e6eaea
set $fg_dim  #587b7b
set $red     #e85c51
set $orange  #ff8349
set $yellow  #fda47f
set $green   #7aa4a1
set $blue    #5a93aa
set $purple  #ad5c7c
set $aqua    #a1cdd8
set $pink    #cb7985
# accent: focused window + active workspace
set $accent  #ad5c7c
