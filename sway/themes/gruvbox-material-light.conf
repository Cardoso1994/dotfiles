set $bg      #fbf1c7
set $bg_trans #fbf1c7d9
set $bg_bar  #f2e5bc
set $bg_alt  #f4e8be
set $sel     #eee0b7
set $fg      #654735
set $fg_dim  #928374
set $red     #c14a4a
set $orange  #c35e0a
set $yellow  #b47109
set $green   #6c782e
set $blue    #45707a
set $purple  #945e80
set $aqua    #4c7a5d
