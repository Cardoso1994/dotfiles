# Nightfox: dawnfox (light). Values from EdenEast/nightfox.nvim, the same
# palette as wezterm/config/colors.lua.
set $theme_name dawnfox
set $bg      #faf4ed
set $bg_trans #faf4edd9
set $bg_bar  #ebe5df
set $bg_alt  #ebe0df
set $sel     #d0d8d8
set $fg      #575279
set $fg_dim  #a8a3b3
set $red     #b4637a
set $orange  #d7827e
set $yellow  #ea9d34
set $green   #618774
set $blue    #286983
set $purple  #907aa9
set $aqua    #56949f
set $pink    #d685af
# accent: focused window + active workspace (blue: more contrast on the light bg than purple)
set $accent  #286983
